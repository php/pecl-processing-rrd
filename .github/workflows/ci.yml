name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install librrd
        run: |
          sudo apt-get update
          sudo apt-get install -y librrd-dev pkg-config rrdtool

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none

      - name: Build
        run: |
          phpize
          ./configure --with-rrd
          make -j"$(nproc)"

      - name: Generate test fixtures
        run: make -C tests/data all

      - name: Test
        run: make test
        env:
          NO_INTERACTION: 1
          REPORT_EXIT_STATUS: 1

      - name: Show test diffs on failure
        if: failure()
        run: |
          for f in tests/*.diff tests/*.out tests/*.log; do
            [ -f "$f" ] && { echo "===== $f ====="; cat "$f"; }
          done
          exit 0
